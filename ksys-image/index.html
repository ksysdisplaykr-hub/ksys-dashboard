<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KSYS Image Preview</title>
<style>
/* VOICE: quiet, gallery-like — the image is the only subject
   IDEA: a light table holding two prints
   PICTURE: the two images themselves, large
   COLOUR and TYPE: near-black ground, white ink; Inter
   LAYOUT: modest title, two cards side by side, stacked on phones */
:root{color-scheme:dark;--bg:#0f1115;--card:#181b21;--ink:#f2f3f5;--mute:#9aa1ad;--line:#2a2f38}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip}
main{max-width:1240px;margin:0 auto;padding:clamp(24px,4vw,56px) max(4vw,16px)}
h1{font-size:clamp(24px,3.4vw,36px);line-height:1.1;margin:0 0 6px;font-weight:650}
.sub{color:var(--mute);margin:0 0 28px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{all:unset;cursor:zoom-in;display:block;position:relative;background:#000}
.thumb img{display:block;width:100%;height:clamp(220px,32vw,400px);object-fit:contain;transition:transform .3s}
.thumb:hover img{transform:scale(1.015)}
.thumb:focus-visible{outline:3px solid #6aa8ff;outline-offset:-3px}
.tag{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px}
.meta{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.meta b{font-weight:600}.meta span{color:var(--mute);font-size:14px;white-space:nowrap}
.meta a{color:#8fbcff;font-size:14px;text-decoration:none;white-space:nowrap}
.meta a:hover{text-decoration:underline}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:10;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100vw;max-height:100vh;object-fit:contain;user-select:none}
.lb.full{overflow:auto;display:block;cursor:zoom-out}
.lb.full.on{display:block}
.lb.full img{max-width:none;max-height:none}
.bar{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:11}
.bar button{all:unset;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;font-size:14px;min-height:44px;padding:0 16px;border-radius:10px;display:flex;align-items:center}
.bar button:hover{background:rgba(255,255,255,.26)}
.bar button:focus-visible{outline:2px solid #6aa8ff}
.cap{position:fixed;left:12px;bottom:12px;color:#ddd;font-size:13px;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:8px;z-index:11}
@media(prefers-reduced-motion:reduce){.thumb img{transition:none}}
</style>
</head>
<body>
<main>
  <h1>KSYS Headquarters</h1>
  <p class="sub">Tap an image to preview it full screen · 이미지를 누르면 전체 화면으로 미리보기됩니다</p>
  <div class="grid">
    <div class="card">
      <button class="thumb" data-src="ksys_original.jpg" data-cap="Original · 2576 × 2259" aria-label="Preview original image">
        <img src="ksys_original.jpg" alt="KSYS headquarters building, original image">
        <span class="tag">Original</span>
      </button>
      <div class="meta"><b>Original 원본</b><span>2576 × 2259 px</span><a href="ksys_original.jpg" target="_blank" rel="noopener">Open file ↗</a></div>
    </div>
    <div class="card">
      <button class="thumb" data-src="ksys_1920x1080.jpg" data-cap="16:9 · 1920 × 1080" aria-label="Preview 16:9 image">
        <img src="ksys_1920x1080.jpg" alt="KSYS headquarters building, 16:9 crop">
        <span class="tag">16:9</span>
      </button>
      <div class="meta"><b>16:9 Full HD</b><span>1920 × 1080 px</span><a href="ksys_1920x1080.jpg" target="_blank" rel="noopener">Open file ↗</a></div>
    </div>
  </div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image preview">
  <img id="lbimg" alt="">
</div>
<div class="bar" id="bar" hidden>
  <button id="zoom" type="button">Actual size 100%</button>
  <button id="close" type="button">Close ✕</button>
</div>
<div class="cap" id="cap" hidden></div>

<script>
{
  const lb=document.getElementById('lb'),img=document.getElementById('lbimg'),bar=document.getElementById('bar'),cap=document.getElementById('cap'),zoom=document.getElementById('zoom');
  const open=(src,c)=>{img.src=src;img.alt=c;cap.textContent=c;lb.classList.remove('full');zoom.textContent='Actual size 100%';lb.classList.add('on');bar.hidden=false;cap.hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus()};
  const close=()=>{lb.classList.remove('on','full');bar.hidden=true;cap.hidden=true;document.body.style.overflow=''};
  document.querySelectorAll('.thumb').forEach(b=>b.addEventListener('click',()=>open(b.dataset.src,b.dataset.cap)));
  lb.addEventListener('click',close);
  document.getElementById('close').addEventListener('click',close);
  zoom.addEventListener('click',()=>{const f=lb.classList.toggle('full');zoom.textContent=f?'Fit to screen':'Actual size 100%'});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}
</script>
</body>
</html>
